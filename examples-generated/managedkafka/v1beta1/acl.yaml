apiVersion: managedkafka.gcp.upbound.io/v1beta1
kind: Acl
metadata:
  annotations:
    meta.upbound.io/example-id: managedkafka/v1beta1/acl
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    aclEntries:
    - host: '*'
      operation: ALL
      permissionType: ALLOW
      principal: User:admin@my-project.iam.gserviceaccount.com
    - host: '*'
      operation: WRITE
      permissionType: ALLOW
      principal: User:producer-client@my-project.iam.gserviceaccount.com
    clusterSelector:
      matchLabels:
        testing.upbound.io/example-name: cluster
    location: us-central1

---

apiVersion: managedkafka.gcp.upbound.io/v1beta1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: managedkafka/v1beta1/acl
  labels:
    testing.upbound.io/example-name: cluster
  name: cluster
spec:
  forProvider:
    capacityConfig:
    - memoryBytes: 3221225472
      vcpuCount: 3
    clusterId: my-cluster
    gcpConfig:
    - accessConfig:
      - networkConfigs:
        - subnet: projects/${data.google_project.project.number}/regions/us-central1/subnetworks/default
    location: us-central1
