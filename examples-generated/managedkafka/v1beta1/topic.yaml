apiVersion: managedkafka.gcp.upbound.io/v1beta1
kind: Topic
metadata:
  annotations:
    meta.upbound.io/example-id: managedkafka/v1beta1/topic
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    clusterSelector:
      matchLabels:
        testing.upbound.io/example-name: cluster
    configs:
      cleanup.policy: compact
    location: us-central1
    partitionCount: 2
    replicationFactor: 3
    topicId: my-topic

---

apiVersion: managedkafka.gcp.upbound.io/v1beta1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: managedkafka/v1beta1/topic
  labels:
    testing.upbound.io/example-name: cluster
  name: cluster
spec:
  forProvider:
    capacityConfig:
    - memoryBytes: 3221225472
      vcpuCount: 3
    clusterId: my-cluster
    gcpConfig:
    - accessConfig:
      - networkConfigs:
        - subnet: projects/${data.google_project.project.number}/regions/us-central1/subnetworks/default
    location: us-central1
