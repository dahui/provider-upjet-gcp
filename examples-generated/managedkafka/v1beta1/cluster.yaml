apiVersion: managedkafka.gcp.upbound.io/v1beta1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: managedkafka/v1beta1/cluster
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    capacityConfig:
    - memoryBytes: 3221225472
      vcpuCount: 3
    clusterId: my-cluster
    gcpConfig:
    - accessConfig:
      - networkConfigs:
        - subnet: projects/${data.google_project.project.number}/regions/us-central1/subnetworks/default
    labels:
      key: value
    location: us-central1
    rebalanceConfig:
    - mode: AUTO_REBALANCE_ON_SCALE_UP
